name: Mobile Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # schedule:
    # Run tests daily at 2 AM UTC
    # - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test (android/ios/both)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - both
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'

env:
  NODE_VERSION: '24.x'
  ANDROID_API_LEVEL: 30
  ANDROID_ARCH: x86_64

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Check code formatting
        run: npm run format:check

  test-android:
    name: Android Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event.inputs.platform == null
    
    strategy:
      matrix:
        include:
          - api-level: 30
            platform-version: '11.0'
          - api-level: 31
            platform-version: '12.0'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Appium
        run: |
          npm install -g appium@3
          # macos-latest runner images ship Appium with uiautomator2 pre-registered,
          # so install only if it isn't already there.
          appium driver list --installed 2>&1 | grep -q uiautomator2 || appium driver install uiautomator2

      - name: Enable KVM group perms
        run: |
          # ubuntu-latest has /dev/kvm but this user isn't in the kvm group, so the
          # emulator falls back to software x86_64 emulation (see "ProbeKVM" in job logs).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v3-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ANDROID_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_APP_PATH: ${{ github.workspace }}/apps/android/FrontRow.apk
          ANDROID_PLATFORM_VERSION: ${{ matrix.platform-version }}
          # Only one emulator/capability exists per job, but MAX_INSTANCES=2
          # (the dev default) still starts overlapping UiAutomator2 sessions
          # against that single device. Confirmed via wdio-appium.log: every
          # "Appium Settings app is not running after 30000ms" failure showed
          # 3-4 session IDs simultaneously polling/starting io.appium.settings
          # on the same emulator-5554 (concurrent sessions plus a failed
          # session's teardown overlapping the next one's startup). Force
          # serial execution in CI.
          MAX_INSTANCES: 1
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ANDROID_ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            npm run test:android

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android-${{ matrix.api-level }}
          path: reports/allure-results
          retention-days: 30

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android-${{ matrix.api-level }}
          path: reports/screenshots
          retention-days: 7

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android-${{ matrix.api-level }}
          path: reports/logs
          retention-days: 7

  test-ios:
    name: iOS Tests
    runs-on: macos-latest
    needs: lint-and-typecheck
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'
    
    strategy:
      matrix:
        ios-version: ['16.0', '16.4']
        device: ['iPhone 14 Pro']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Appium
        run: |
          npm install -g appium@3
          # macos-latest runner images ship Appium with xcuitest pre-registered,
          # so install only if it isn't already there.
          appium driver list --installed 2>&1 | grep -q xcuitest || appium driver install xcuitest

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Boot iOS Simulator
        run: |
          DEVICE_UUID=$(xcrun simctl list devices available | grep "${{ matrix.device }}" | grep "${{ matrix.ios-version }}" | head -1 | grep -o '[0-9A-F]\{8\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{12\}')
          xcrun simctl boot $DEVICE_UUID

      - name: Run iOS tests
        run: npm run test:ios

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios-${{ matrix.ios-version }}
          path: reports/allure-results
          retention-days: 30

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios-${{ matrix.ios-version }}
          path: reports/screenshots
          retention-days: 7

  check-browserstack-secrets:
    name: Check BrowserStack Secrets
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check secrets are configured
        id: check
        # The secrets context isn't available in a job-level `if:`, so the
        # presence check has to happen in a step and get passed along as an output.
        run: |
          if [ -n "${{ secrets.BROWSERSTACK_USERNAME }}" ] && [ -n "${{ secrets.BROWSERSTACK_ACCESS_KEY }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

  test-browserstack:
    name: BrowserStack Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, check-browserstack-secrets]
    # Skips cleanly on forks/PRs where the secrets aren't configured yet,
    # rather than failing the whole run over a missing BrowserStack account.
    if: needs.check-browserstack-secrets.outputs.has-secrets == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upload app to BrowserStack
        run: npm run browserstack:upload:android
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: Run Android tests on BrowserStack
        run: npm run test:browserstack:android
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-browserstack
          path: reports/allure-results
          retention-days: 30

  publish-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [test-android, test-ios, test-browserstack]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Allure Report action
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: gh-pages/allure-history
          keep_reports: 20

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [test-android, test-ios, test-browserstack]
    if: always()

    steps:
      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Mobile automation tests completed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
